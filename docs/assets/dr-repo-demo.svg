<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 761 648" width="761" height="648" role="img" aria-labelledby="t d">
<title id="t">Dr. Repo checking a project with three planted faults</title>
<desc id="d">A terminal runs &quot;npm run dr-repo -- ../my-old-project&quot;. Dr. Repo prints its diagnosis line by line: ok   .env files are git-ignored; FIX  no .env file is committed; FIX  no secret-looking strings in tracked files; ok   git uses your private GitHub email; ok   CLAUDE.md exists (the rules Claude reads first); ok   PROGRESS.md exists (the memory between sessions); FIX  .claude/settings.json exists and allows nothing risky without asking; ok   a PreToolUse guard hook is wired and its file exists; ok   Claude cannot edit its own settings or hooks; ok   commands, agents and .git are protected too. Then &quot;Score: 7/10&quot; and the suggestion to run again with --prompt.</desc>
