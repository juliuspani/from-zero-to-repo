<text class="bar" x="380.5" y="22" text-anchor="middle">my-old-project — npm run dr-repo</text>
<line x1="0" y1="34" x2="761" y2="34" stroke="#30363d"/>
<g transform="translate(20 0)">
<text y="64"><tspan class="ps">$ </tspan><tspan class="cmd">npm run dr-repo -- ../my-old-project</tspan></text>
<rect class="cover" x="14.2" y="51" width="293.9" height="18" fill="#0d1117"/>
<text class="l detail" y="82" style="animation-name:a0"></text>
<text class="l head" y="100" style="animation-name:a1">Dr. Repo's diagnosis (read-only, no network)</text>
<text class="l detail" y="118" style="animation-name:a2"></text>
<text class="l ok" y="136" style="animation-name:a3">  <tspan class="okm">ok</tspan>   .env files are git-ignored</text>
<text class="l fix" y="154" style="animation-name:a4">  <tspan class="fixm">FIX</tspan>  no .env file is committed</text>
<text class="l detail" y="172" style="animation-name:a5">        committed: .env</text>
<text class="l how" y="190" style="animation-name:a6">        <tspan class="lbl">how:</tspan> Untrack it (git rm --cached -- &lt;file&gt;), rotate every key it held, and ignore</text>
<text class="l how" y="208" style="animation-name:a7">          it.</text>
<text class="l why" y="226" style="animation-name:a8">        <tspan class="lbl">why:</tspan> https://github.com/juliuspani/from-zero-to-repo/blob/main/docs/mistakes-museum.</text>
<text class="l why" y="244" style="animation-name:a9">          md#the-env-rule-that-blocked-the-wrong-file</text>
<text class="l fix" y="262" style="animation-name:a10">  <tspan class="fixm">FIX</tspan>  no secret-looking strings in tracked files</text>
<text class="l detail" y="280" style="animation-name:a11">        config.js:1 (AWS access key)</text>
<text class="l how" y="298" style="animation-name:a12">        <tspan class="lbl">how:</tspan> Move the value to .env (ignored), read it from the environment, and rotate the</text>
<text class="l how" y="316" style="animation-name:a13">          key: it is already exposed.</text>
<text class="l why" y="334" style="animation-name:a14">        <tspan class="lbl">why:</tspan> https://github.com/juliuspani/from-zero-to-repo/blob/main/docs/mistakes-museum.</text>
<text class="l why" y="352" style="animation-name:a15">          md#the-env-rule-that-blocked-the-wrong-file</text>
<text class="l ok" y="370" style="animation-name:a16">  <tspan class="okm">ok</tspan>   git uses your private GitHub email</text>
<text class="l ok" y="388" style="animation-name:a17">  <tspan class="okm">ok</tspan>   CLAUDE.md exists (the rules Claude reads first)</text>
<text class="l ok" y="406" style="animation-name:a18">  <tspan class="okm">ok</tspan>   PROGRESS.md exists (the memory between sessions)</text>
<text class="l fix" y="424" style="animation-name:a19">  <tspan class="fixm">FIX</tspan>  .claude/settings.json exists and allows nothing risky without asking</text>
<text class="l detail" y="442" style="animation-name:a20">        settings.json: Bash(*) (any command)</text>
<text class="l how" y="460" style="animation-name:a21">        <tspan class="lbl">how:</tspan> Start from from-zero-to-repo/.claude/settings.jsonc: push, network, shells and</text>
<text class="l how" y="478" style="animation-name:a22">          interpreters in &quot;ask&quot;, never a bare Bash; check settings.local.json too.</text>
<text class="l why" y="496" style="animation-name:a23">        <tspan class="lbl">why:</tspan> https://github.com/juliuspani/from-zero-to-repo/blob/main/docs/mistakes-museum.</text>
<text class="l why" y="514" style="animation-name:a24">          md#the-settings-file-that-was-a-txt</text>
<text class="l ok" y="532" style="animation-name:a25">  <tspan class="okm">ok</tspan>   a PreToolUse guard hook is wired and its file exists</text>
<text class="l ok" y="550" style="animation-name:a26">  <tspan class="okm">ok</tspan>   Claude cannot edit its own settings or hooks</text>
<text class="l ok" y="568" style="animation-name:a27">  <tspan class="okm">ok</tspan>   commands, agents and .git are protected too</text>
<text class="l detail" y="586" style="animation-name:a28"></text>
<text class="l score" y="604" style="animation-name:a29">Score: 7/10</text>
<text class="l rx" y="622" style="animation-name:a30">Prescription: run again with --prompt to get a prompt for each fix.</text>
</g>
</svg>
